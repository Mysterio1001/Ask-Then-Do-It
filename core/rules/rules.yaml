core_version: 1.3.0
capability_profiles:
  conversation:
    includes: []
    description: Exchange text and emit user-managed artifacts.
  tools:
    includes:
      - conversation
    description: Inspect and modify a repository, persist artifacts, and execute commands.
  multi_agent:
    includes:
      - conversation
      - tools
    description: Create isolated worker or reviewer contexts.
rules:
  - id: CAP-DECLARE-001
    mandatory: true
    module: orchestration
    statement: Declare proven capability profiles before selecting executable stages.
  - id: CAP-CLAIM-001
    mandatory: true
    module: orchestration
    statement: Never claim an action or evidence that declared capabilities cannot produce.
  - id: MODE-RESOLVE-001
    mandatory: true
    module: orchestration
    statement: Resolve exactly one top-level full or lite mode for every public workflow entry through the canonical resolver or an equivalent bounded host-specific entry guard; stage selection does not imply Full and the operation override is never persisted.
  - id: FULL-PRESERVE-001
    mandatory: true
    module: orchestration
    statement: Preserve every existing Full gate, artifact, Ticket test choice, implementation route, Review requirement, and architecture contract.
  - id: LITE-QUESTIONS-001
    mandatory: true
    module: lite-workflow
    statement: Limit each Lite clarification round to the highest-impact blocking questions within the approved count, sentence, recommendation, and token budgets.
  - id: LITE-BRIEF-001
    mandatory: true
    module: lite-workflow
    statement: Require one complete conversation-only Lite Change Brief and exactly one explicit approval before implementation without creating workflow artifacts.
  - id: LITE-RISK-001
    mandatory: true
    module: lite-workflow
    statement: Pause on material high-risk evidence before or during Lite implementation and let the user choose Full or Lite for only the current operation.
  - id: LITE-VALIDATE-001
    mandatory: true
    module: lite-workflow
    statement: Prohibit new tests and TDD claims in Lite while requiring applicable diff, static, success-path, failure-path, and unresolved-failure validation behavior.
  - id: LITE-REVIEW-001
    mandatory: true
    module: lite-workflow
    statement: Perform one compact Lite Review and require explicit user approval before correcting the complete in-scope findings batch.
  - id: LITE-SESSION-001
    mandatory: true
    module: lite-workflow
    statement: Report Lite outcomes within the approved completion budget without treating conversation-only state as durable across sessions.
  - id: GATE-REQ-001
    mandatory: true
    module: requirements
    statement: Require explicit human confirmation of requirement consensus.
  - id: GATE-SPEC-001
    mandatory: true
    module: specification
    statement: Require explicit human approval before marking a Specification Approved.
  - id: GATE-PLAN-001
    mandatory: true
    module: ticket-planning
    statement: Require explicit plain-language test choices in one batch, map every choice to an internal implementation mode, and obtain explicit human approval before marking a Ticket Plan Approved.
  - id: GRILL-ONE-001
    mandatory: true
    module: requirements
    statement: In Full requirement interrogation, ask exactly one requirement question per turn and include a recommendation.
  - id: SPEC-NOCODE-001
    mandatory: true
    module: specification
    statement: Keep production implementation code out of behavioral Specifications.
  - id: PLAN-VERTICAL-001
    mandatory: true
    module: ticket-planning
    statement: Split work into vertically testable behavior rather than horizontal technical layers.
  - id: TDD-RED-001
    mandatory: true
    module: tdd-implementation
    statement: Observe expected test failure before production implementation when automated testing is reasonable.
  - id: REVIEW-EVIDENCE-001
    mandatory: true
    module: review
    statement: Review raw evidence, preserve the Approved Ticket mode, and disclose skipped tests rather than relying on an implementer conclusion.
  - id: ART-STATE-001
    mandatory: true
    module: artifacts
    statement: Preserve explicit Draft and Approved states for gated artifacts.
  - id: ADAPTER-COVERAGE-001
    mandatory: true
    module: adapter-contract
    statement: Map every mandatory core rule in every conforming adapter.
  - id: KB-EVIDENCE-001
    mandatory: true
    module: project-knowledge
    statement: Derive formal Project Knowledge Base content only from approved or accepted evidence.
  - id: KB-DRAFT-001
    mandatory: true
    module: project-knowledge
    statement: Keep unapproved requirement discoveries in Draft Working Notes rather than formal project knowledge.
  - id: KB-SYNC-001
    mandatory: true
    module: project-knowledge
    statement: Disclose additions, modifications, and removals before approving a Project Knowledge Base update.
  - id: REVIEW-LENSES-001
    mandatory: true
    module: review
    statement: Evaluate all twelve core Architecture and Refactoring Lenses with evidence or a justified result.
  - id: ARCH-DIAG-001
    mandatory: true
    module: architecture-improvement
    statement: Keep architecture improvement diagnostic-only unless a later approved workflow authorizes implementation.
  - id: ARCH-DELETE-001
    mandatory: true
    module: architecture-improvement
    statement: Use non-mutating simulated deletion by default and enforce every gate for an actual deletion experiment.
  - id: ARCH-REPORT-001
    mandatory: true
    module: architecture-improvement
    statement: Produce a complete Architecture Improvement Report whose acceptance does not authorize code changes.
  - id: ARCH-REFLOW-001
    mandatory: true
    module: architecture-improvement
    statement: Return accepted architecture improvements through Specification, Ticket Plan, and the plan-selected implementation path.
  - id: ROUTE-USER-001
    mandatory: true
    module: orchestration
    statement: Honor an explicit user-selected module, requirement mode, or Ticket implementation mode over automatic routing unless it violates a safety or approval gate.
  - id: ROUTE-DOCS-001
    mandatory: true
    module: orchestration
    statement: Announce the evidence-based reason whenever documented requirement interrogation is selected automatically.
