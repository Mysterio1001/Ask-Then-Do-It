core_version: 1.3.1
rules:
  CAP-DECLARE-001:
    - file: conformance.yaml
      section: capabilities
      implementation: Declares the cumulative conversation, tools, and multi-agent profiles supported by the Codex adapter.
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/SKILL.md
      section: Declare capabilities
      implementation: Requires the orchestrator to state the strongest runtime-proven profile before routing and to downgrade when tools or isolation are unavailable.
  CAP-CLAIM-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/SKILL.md
      section: Declare capabilities
      implementation: Forbids claims of repository actions, evidence, persistence, or independence beyond the declared runtime profile.
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/SKILL.md
      section: Finish
      implementation: Forbids completion claims while verification or blocking review work remains.
    - file: plugin/ask-then-do-it/skills/review-code/SKILL.md
      section: Validate each finding
      implementation: Requires uncertainty and unavailable evidence to be disclosed instead of invented.
  MODE-RESOLVE-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/SKILL.md
      section: Resolve the top-level mode
      implementation: Resolves only full or lite from an explicit current-operation instruction, the in-project Config, the user Config, and Full fallback while failing closed on present invalid Config and never persisting an override.
    - file: plugin/ask-then-do-it/skills/ask-requirements/SKILL.md
      section: Resolve the top-level mode before this stage
      implementation: Treats direct requirement-stage selection as a stage choice, delegates unresolved mode to the canonical resolver, routes Lite away from the Full stage, and continues only with proven Full mode.
    - file: plugin/ask-then-do-it/skills/ask-with-docs/SKILL.md
      section: Resolve the top-level mode before this stage
      implementation: Treats direct documented-requirement selection as a stage choice, delegates unresolved mode to the canonical resolver, routes Lite away from the Full stage, and continues only with proven Full mode.
    - file: plugin/ask-then-do-it/skills/implement-direct/SKILL.md
      section: Resolve the top-level mode before this stage
      implementation: Treats direct implementation-stage selection as a stage choice, delegates unresolved mode to the canonical resolver, routes Lite away from the Full stage, and continues only with proven Full mode.
    - file: plugin/ask-then-do-it/skills/implement-tdd/SKILL.md
      section: Resolve the top-level mode before this stage
      implementation: Treats direct TDD-stage selection as a stage choice, delegates unresolved mode to the canonical resolver, routes Lite away from the Full stage, and continues only with proven Full mode.
    - file: plugin/ask-then-do-it/skills/improve-architecture/SKILL.md
      section: Resolve the top-level mode before this stage
      implementation: Treats direct architecture-stage selection as a stage choice, delegates unresolved mode to the canonical resolver, routes Lite away from the Full stage, and continues only with proven Full mode.
    - file: plugin/ask-then-do-it/skills/plan-tickets/SKILL.md
      section: Resolve the top-level mode before this stage
      implementation: Treats direct planning-stage selection as a stage choice, delegates unresolved mode to the canonical resolver, routes Lite away from the Full stage, and continues only with proven Full mode.
    - file: plugin/ask-then-do-it/skills/review-code/SKILL.md
      section: Resolve the top-level mode before this stage
      implementation: Treats direct Review-stage selection as a stage choice, delegates unresolved mode to the canonical resolver, routes Lite away from the Full stage, and continues only with proven Full mode.
    - file: plugin/ask-then-do-it/skills/write-spec/SKILL.md
      section: Resolve the top-level mode before this stage
      implementation: Treats direct specification-stage selection as a stage choice, delegates unresolved mode to the canonical resolver, routes Lite away from the Full stage, and continues only with proven Full mode.
  FULL-PRESERVE-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/SKILL.md
      section: Route the selected mode
      implementation: Keeps Lite separate from Ticket implementation modes and sends Full through every existing workflow stage and gate unchanged.
  LITE-QUESTIONS-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/references/lite-workflow.md
      section: Ask blocking questions
      implementation: Limits each Lite round to three ranked blocking questions, an approximately 500-token batch, three short sentences per question, and one recommendation with its tradeoff.
  LITE-BRIEF-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/references/lite-workflow.md
      section: Approve the Change Brief
      implementation: Defines the complete conversation-only Change Brief, approximately 800-token target, exactly one approval, and prohibition on Lite workflow artifacts.
  LITE-RISK-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/references/lite-workflow.md
      section: Reconsider material risk
      implementation: Evaluates material risk before approval and during implementation, pauses modification, and limits any Full or Lite choice to the current operation.
  LITE-VALIDATE-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/references/lite-workflow.md
      section: Validate proportionately
      implementation: Requires applicable diff, static, focused success-path, focused failure-path, unavailable-check, and unresolved-failure handling without defaulting to a complete behavioral suite.
  LITE-REVIEW-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/references/lite-workflow.md
      section: Run compact Review
      implementation: Performs the same-agent compact Review, presents findings in one batch, and requires correction approval while avoiding an empty gate when no findings exist.
  LITE-SESSION-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/references/lite-workflow.md
      section: Complete and start new sessions
      implementation: Defines the approximately 500-token evidence-honest completion and resolves every new session again without claiming durable Lite state.
  GATE-REQ-001:
    - file: plugin/ask-then-do-it/skills/ask-requirements/SKILL.md
      section: Reach consensus
      implementation: Stops until the user explicitly confirms the consolidated requirement.
  GATE-SPEC-001:
    - file: plugin/ask-then-do-it/skills/write-spec/SKILL.md
      section: Run the specification gate
      implementation: Requires explicit approval before changing the Specification from Draft to Approved.
  GATE-PLAN-001:
    - file: plugin/ask-then-do-it/skills/plan-tickets/SKILL.md
      section: Run the plan gate
      implementation: Collects every plain-language test choice in one batch, maps each choice to an internal mode, and requires approval of the displayed complete plan before implementation can begin.
  GRILL-ONE-001:
    - file: plugin/ask-then-do-it/skills/ask-requirements/SKILL.md
      section: Ask exactly one question
      implementation: Requires one question, a concrete recommendation, its tradeoff, and then a stop.
  SPEC-NOCODE-001:
    - file: plugin/ask-then-do-it/skills/write-spec/SKILL.md
      section: Write the behavioral contract
      implementation: Excludes production implementation code and proposed patches from Specifications.
  PLAN-VERTICAL-001:
    - file: plugin/ask-then-do-it/skills/plan-tickets/SKILL.md
      section: Slice vertically
      implementation: Builds each ticket as a verifiable behavior spanning the layers needed by that behavior.
  TDD-RED-001:
    - file: plugin/ask-then-do-it/skills/implement-tdd/SKILL.md
      section: Establish red
      implementation: Requires execution and observation of the expected missing-behavior failure before production implementation.
  REVIEW-EVIDENCE-001:
    - file: plugin/ask-then-do-it/skills/review-code/SKILL.md
      section: Create an independent view
      implementation: Supplies approved artifacts, selected mode, final diff, surrounding code, available test changes, raw results, and skipped-test disclosure without implementer conclusions.
  ART-STATE-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/SKILL.md
      section: Enforce the gates
      implementation: Preserves separate Draft and Approved states and requires artifact state to agree with conversation approval.
    - file: plugin/ask-then-do-it/skills/ask-requirements/SKILL.md
      section: Emit the decision artifact
      implementation: Emits the decision record as Draft and promotes it only after explicit consensus evidence.
    - file: plugin/ask-then-do-it/skills/write-spec/SKILL.md
      section: Run the specification gate
      implementation: Writes Draft first and promotes it only after explicit approval.
    - file: plugin/ask-then-do-it/skills/plan-tickets/SKILL.md
      section: Run the plan gate
      implementation: Writes Draft first and promotes it only after explicit approval.
  ADAPTER-COVERAGE-001:
    - file: conformance.yaml
      section: implemented_rules
      implementation: Enumerates every mandatory rule in core version 1.3.1 for deterministic shared validation.
    - file: rule-mapping.yaml
      section: rules
      implementation: Resolves each mandatory rule to its concrete Codex adapter implementation.
  KB-EVIDENCE-001:
    - file: plugin/ask-then-do-it/skills/ask-with-docs/SKILL.md
      section: Use approved evidence
      implementation: Derives formal project knowledge only from approved or accepted evidence and leaves unsupported facts unresolved.
  KB-DRAFT-001:
    - file: plugin/ask-then-do-it/skills/ask-with-docs/SKILL.md
      section: Keep provisional notes
      implementation: Keeps proposed, confirmed, and unresolved discoveries in Draft Working Notes until the combined approval gate passes.
  KB-SYNC-001:
    - file: plugin/ask-then-do-it/skills/ask-with-docs/SKILL.md
      section: Approve the record and knowledge together
      implementation: Displays additions, modifications, and removals and binds approval to only the disclosed knowledge changes.
  REVIEW-LENSES-001:
    - file: plugin/ask-then-do-it/skills/review-code/SKILL.md
      section: Apply the twelve lenses
      implementation: Applies every core lens to the change scope and requires evidence or a justified result for each one.
  ARCH-DIAG-001:
    - file: plugin/ask-then-do-it/skills/improve-architecture/SKILL.md
      section: Declare scope and capability
      implementation: Declares a diagnostic-only analysis boundary and prohibits implementation during architecture assessment.
  ARCH-DELETE-001:
    - file: plugin/ask-then-do-it/skills/improve-architecture/SKILL.md
      section: Simulate deletion safely
      implementation: Makes non-mutating simulation the default and requires authorization, tools, and isolation for an actual experiment.
  ARCH-REPORT-001:
    - file: plugin/ask-then-do-it/skills/improve-architecture/SKILL.md
      section: Emit the architecture report
      implementation: Emits all required Architecture Improvement Report fields and sections.
  ARCH-REFLOW-001:
    - file: plugin/ask-then-do-it/skills/improve-architecture/SKILL.md
      section: Enforce report state and handoff
      implementation: Routes accepted proposals through Specification, vertical Ticket Plan, and the plan-selected TDD or direct implementation path.
  ROUTE-USER-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/SKILL.md
      section: Honor explicit user control
      implementation: Gives direct module, requirement-mode, and Approved Ticket implementation-mode selection precedence over automatic routing while preserving gates.
  ROUTE-DOCS-001:
    - file: plugin/ask-then-do-it/skills/ask-then-do-it/SKILL.md
      section: Choose the requirement mode
      implementation: Selects documented interrogation from the three approved conditions and states a brief reason.
